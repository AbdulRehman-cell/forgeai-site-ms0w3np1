# render.yaml — Render Blueprint
# Two valid paths are supported; this blueprint uses Render's
# native "static" service type, which is the correct, cheapest,
# and fastest option for a site with zero backend/build step.
#
# If you prefer the Docker image (e.g. for custom headers via nginx.conf
# exactly as configured), switch `type: web` + `env: docker` — see
# commented alternative below.

services:
  - type: web
    name: care-services-site
    env: static
    plan: free
    branch: main
    buildCommand: "echo 'No build step — static HTML/CSS/JS site'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*.css
        name: Cache-Control
        value: public, max-age=2592000, immutable
      - path: /*.js
        name: Cache-Control
        value: public, max-age=2592000, immutable
    routes:
      - type: rewrite
        source: /
        destination: /index.html

  # ---- Alternative: Docker-based deploy using the Dockerfile above ----
  # - type: web
  #   name: care-services-site-docker
  #   env: docker
  #   plan: free
  #   dockerfilePath: ./Dockerfile
