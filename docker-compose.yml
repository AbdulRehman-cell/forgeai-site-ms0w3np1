# docker-compose.yml
# This static site needs no database, cache, or backend services.
# Compose is provided purely for local dev/testing of the exact
# same nginx image that will run in production.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: care-services-site:1.0.0
    ports:
      - "8080:8080"
    environment:
      # No app-level env vars needed — site is fully static.
      # Kept here only if you later add analytics IDs etc.
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped